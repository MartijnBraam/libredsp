<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Node</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: sans-serif;
            font-size: 11pt;
        }

        html {
            padding: 5px;
        }

        body {
            height: calc(100% - 10px);
            background: #101010;
            display: grid;
            grid-template-areas:
                "header header"
                "aside main";
            grid-template-columns: minmax(100px, 1fr) minmax(100px, 3fr);
            grid-template-rows: 24px 1fr;
        }

        header {
            grid-area: header;
            background: #222222;
            color: white;
            border-radius: 6px 6px 0 0;
        }

        aside {
            grid-area: aside;
            background: #303030;
            color: white;
            min-height: 0;
        }

        main {
            grid-area: main;
            background: #1a1a1a;
        }
    </style>
</head>
<body>
<header>
    DATA!
</header>
<aside>
    HA
</aside>
<main>
    <canvas id="canvas"></canvas>
</main>
<script type="module" src="libredsp.js"></script>
<script type="module">
    import LibreDSP from './libredsp.js';

    const dsp = new LibreDSP(document.getElementById('canvas'));
</script>
</body>
</html>
