; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:variaxmini]
platform = teensy
board = teensy41
board_name = variax
framework = arduino
extra_scripts = pre:build_web.py
build_flags = -D USB_MIDI_AUDIO_SERIAL -D BOARD_VARIAX
lib_deps =
    ssilverman/QNEthernet@^0.37.0
    bblanchon/ArduinoJson@^7.4.3
    https://github.com/palmerr23/control_TLV320AIC3104

[env:fosdemrevh]
platform = teensy
board = teensy41
board_name= fosdem_revh
framework = arduino
extra_scripts = pre:build_web.py
build_flags = -D USB_MIDI_AUDIO_SERIAL -D BOARD_REVH
lib_deps =
    ssilverman/QNEthernet@^0.37.0
    bblanchon/ArduinoJson@^7.4.3

[env:fosdemrevc]
platform = teensy
board = teensy41
board_name = fosdem_revc
framework = arduino
extra_scripts = pre:build_web.py
                pre:build_nodes.py
build_flags = -D USB_MIDI_AUDIO_SERIAL -D BOARD_REVC
lib_deps =
    ssilverman/QNEthernet@^0.37.0
    bblanchon/ArduinoJson@^7.4.3
    khoih-prog/Teensy41_AsyncTCP@>=1.1.0